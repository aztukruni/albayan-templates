<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>قالب إعلان الاجتماع القادم — نادي البيان للتوستماسترز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#070d1f;--panel:#0e1730;--line:rgba(255,255,255,.08);--gold:#d9b25a;--text:#e9ecf5;--muted:#8e98b3}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;
  background:radial-gradient(1200px 600px at 70% -10%,#16224a 0,transparent 60%),var(--bg)}
.wrap{max-width:1220px;margin:0 auto;padding:28px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
header{grid-column:1/-1}
.back{display:inline-block;color:var(--gold);text-decoration:none;font-size:14px;margin-bottom:8px}
h1{font-family:Cairo,sans-serif;font-weight:800;font-size:22px;margin:0}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;position:sticky;top:16px}
canvas{display:block;width:100%;max-width:760px;margin:0 auto;height:auto;border-radius:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:18px}
.group h2{font-size:13px;color:var(--gold);margin:0 0 10px;font-weight:600}
label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 6px}
input[type=text]{width:100%;background:#0a1226;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
input[type=text]:focus{outline:none;border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:10px}
.btns{display:flex;flex-direction:column;gap:8px}
button{font:inherit;font-weight:600;font-size:14px;border-radius:12px;padding:11px 14px;border:1px solid var(--line);background:#14203f;color:var(--text);cursor:pointer;width:100%}
button.primary{background:linear-gradient(180deg,#f1d68b,#c9993f);color:#0b1430;border:none}
button:hover{filter:brightness(1.1)}
.hint{font-size:12px;color:var(--muted);line-height:1.8}
@media (max-width:900px){.wrap{grid-template-columns:1fr}.stage{position:static}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html" class="back">→ كل القوالب</a>
    <h1>قالب إعلان الاجتماع القادم — نادي البيان للتوستماسترز</h1>
    <div class="sub">عبّئ بيانات الاجتماع وحمّل الإعلان (1080×1080).</div>
  </header>

  <div class="stage">
    <canvas id="cv" width="1080" height="1080"></canvas>
  </div>

  <aside class="panel">
    <div class="group">
      <h2>الاجتماع</h2>
      <div class="field"><label for="num">رقم الاجتماع</label><input type="text" id="num" placeholder="مثال: 25"></div>
      <div class="field"><label for="theme">موضوع اللقاء</label><input type="text" id="theme" placeholder="مثال: فن الإقناع"></div>
    </div>

    <div class="group">
      <h2>الموعد والمكان</h2>
      <div class="row">
        <div class="field"><label for="date">التاريخ</label><input type="text" id="date" placeholder="25 نوفمبر 2026"></div>
        <div class="field"><label for="day">اليوم</label><input type="text" id="day" placeholder="الأربعاء"></div>
      </div>
      <div class="row">
        <div class="field"><label for="time">الوقت</label><input type="text" id="time" placeholder="8:00 مساءً"></div>
        <div class="field"><label for="timeNote">تحت الوقت</label><input type="text" id="timeNote" placeholder="مثال: لمدة ساعتين"></div>
      </div>
      <div class="row">
        <div class="field"><label for="venue">المكان</label><input type="text" id="venue" placeholder="اسم القاعة / المبنى"></div>
        <div class="field"><label for="city">تحت المكان</label><input type="text" id="city" placeholder="الرياض"></div>
      </div>
    </div>

    <div class="group">
      <h2>النصوص</h2>
      <div class="field"><label for="kicker">السطر فوق العنوان</label><input type="text" id="kicker"></div>
      <div class="field"><label for="title">العنوان</label><input type="text" id="title"></div>
      <div class="field"><label for="note">الملاحظة أسفل الإعلان</label><input type="text" id="note"></div>
      <div class="field"><label for="slogan">شعار النادي (السلوقان)</label><input type="text" id="slogan"></div>
      <button id="reset">استرجاع النصوص الافتراضية</button>
    </div>

    <div class="group">
      <h2>التحميل</h2>
      <div class="btns">
        <button class="primary" id="dl">تحميل الإعلان PNG</button>
        <button id="dlBlank">تحميل القالب بدون بيانات</button>
      </div>
      <p class="hint">القالب بدون بيانات يحتفظ بالعناوين والأيقونات ويترك أماكن الموضوع والتاريخ والوقت والمكان فاضية، تقدر تكمّلها في كانفا.</p>
    </div>
  </aside>
</div>

/* ---------- helpers ---------- */
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function glow(c, x, y, r, col) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
}
function goldGrad(c, x0, y0, x1, y1) {
  const g = c.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#f8e7ad'); g.addColorStop(.5, '#d6ab4e'); g.addColorStop(1, '#f3d88f');
  return g;
}
function fitFont(c, text, weight, size, family, maxW) {
  let s = size;
  do { c.font = `${weight} ${s}px ${family}`; } while (c.measureText(text).width > maxW && --s > 12);
  return s;
}

/* ---------- logos ---------- */
// Club logo comes on white: drop the white, turn the navy lettering cream so it reads on the dark design, keep the gold.
function loadImg(src) { return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.src = src; }); }
async function loadClubLogo() {
  const img = await loadImg(LOGO_SRC);
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const x = c.getContext('2d'); x.drawImage(img, 0, 0);
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data;
  const CREAM = [246, 240, 226];
  for (let i = 0; i < p.length; i += 4) {
    const r = p[i], g = p[i + 1], b = p[i + 2];
    const a = clamp((255 - Math.min(r, g, b) - 12) / 110, 0, 1);
    if (a > 0) {
      const ur = clamp((r - 255 * (1 - a)) / a, 0, 255), ug = clamp((g - 255 * (1 - a)) / a, 0, 255), ub = clamp((b - 255 * (1 - a)) / a, 0, 255);
      if (ub > ur) { p[i] = CREAM[0]; p[i + 1] = CREAM[1]; p[i + 2] = CREAM[2]; }      // navy → cream
      else { p[i] = clamp(ur * 1.08, 0, 255); p[i + 1] = clamp(ug * 1.08, 0, 255); p[i + 2] = ub; } // gold, slightly brighter
    }
    p[i + 3] = a * 255;
  }
  x.putImageData(d, 0, 0); return c;
}

/* ---------- layers ---------- */
function drawBackground(c) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0e1838'); g.addColorStop(.55, '#0a1229'); g.addColorStop(1, '#060b1a');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  glow(c, 540, 470, 640, 'rgba(214,170,80,0.12)');
  glow(c, 90, 40, 560, 'rgba(70,110,230,0.20)');
  glow(c, 1020, 1060, 520, 'rgba(70,110,230,0.13)');

  // dot grid fading from two corners
  c.fillStyle = '#ffffff';
  for (let y = 13; y < H; y += 26) for (let x = 13; x < W; x += 26) {
    const a = Math.max(0, 1 - Math.hypot(x - W, y) / 470) * .10 + Math.max(0, 1 - Math.hypot(x, y - H) / 470) * .10;
    if (a < .005) continue;
    c.globalAlpha = a; c.beginPath(); c.arc(x, y, 1.4, 0, Math.PI * 2); c.fill();
  }
  c.globalAlpha = 1;

  // "sound wave" rings – a nod to public speaking
  const rings = (cx, cy) => {
    for (let i = 0; i < 7; i++) {
      c.beginPath(); c.arc(cx, cy, 130 + i * 68, 0, Math.PI * 2);
      c.strokeStyle = `rgba(217,178,90,${0.11 * (1 - i / 7)})`; c.lineWidth = 1.5; c.stroke();
    }
  };
  rings(-30, 1010); rings(1110, 70);

  // corner brackets
  const L = 86, ins = 34, rad = 14;
  c.lineWidth = 2; c.strokeStyle = 'rgba(226,190,110,0.75)'; c.lineCap = 'round';
  [[ins, ins, 1, 1], [W - ins, ins, -1, 1], [ins, H - ins, 1, -1], [W - ins, H - ins, -1, -1]].forEach(([x, y, sx, sy]) => {
    c.beginPath(); c.moveTo(x, y + sy * L); c.arcTo(x, y, x + sx * L, y, rad); c.lineTo(x + sx * L, y); c.stroke();
  });
}

function drawLogo(c) {
  if (!logo || !tiLogo) return;
  const cy = 114, gap = 36;
  const ch = 142, cw = ch * logo.width / logo.height;        // club logo
  const th = 100, tw = th * tiLogo.width / tiLogo.height;    // Toastmasters International
  const total = cw + gap * 2 + tw, x0 = (W - total) / 2;
  c.imageSmoothingQuality = 'high';
  c.drawImage(tiLogo, x0, cy - th / 2, tw, th);
  const dx = x0 + tw + gap;
  const g = c.createLinearGradient(0, cy - 55, 0, cy + 55);
  g.addColorStop(0, 'rgba(226,190,110,0)'); g.addColorStop(.5, 'rgba(226,190,110,.8)'); g.addColorStop(1, 'rgba(226,190,110,0)');
  c.fillStyle = g; c.fillRect(dx - 1, cy - 55, 2, 110);
  c.drawImage(logo, dx + gap, cy - ch / 2, cw, ch);
}

// mode: 'preview' shows muted placeholders, 'final' shows only what's filled, 'blank' drops all meeting data
const val = (k, mode) => mode === 'blank' ? '' : (T[k] || '').trim();

function drawIcon(c, kind, x, y) {
  c.save(); c.translate(x, y);
  c.strokeStyle = '#0b1430'; c.fillStyle = '#0b1430'; c.lineWidth = 3; c.lineCap = 'round'; c.lineJoin = 'round';
  if (kind === 'cal') {
    rr(c, -14, -11, 28, 25, 4); c.stroke();
    c.fillRect(-14, -11, 28, 7);
    c.beginPath(); c.moveTo(-7, -16); c.lineTo(-7, -9); c.moveTo(7, -16); c.lineTo(7, -9); c.stroke();
    [[-6, 3], [0, 3], [6, 3], [-6, 9], [0, 9]].forEach(([a, b]) => c.fillRect(a - 1.5, b - 1.5, 3, 3));
  } else if (kind === 'clock') {
    c.beginPath(); c.arc(0, 0, 14, 0, Math.PI * 2); c.stroke();
    c.beginPath(); c.moveTo(0, -8); c.lineTo(0, 0); c.lineTo(6, 4); c.stroke();
  } else {
    c.beginPath(); c.moveTo(0, 16);
    c.bezierCurveTo(-4, 10, -13, 2, -13, -5); c.arc(0, -5, 13, Math.PI, 0); c.bezierCurveTo(13, 2, 4, 10, 0, 16);
    c.closePath(); c.fill();
    c.beginPath(); c.arc(0, -5, 5, 0, Math.PI * 2); c.fillStyle = '#e8c56e'; c.fill();
  }
  c.restore();
}

function sideLines(c, cx, y, halfW, gap, len, diamond) {
  [-1, 1].forEach(s => {
    const x0 = cx + s * (halfW + gap), x1 = x0 + s * len;
    const g = c.createLinearGradient(x0, 0, x1, 0);
    g.addColorStop(0, 'rgba(226,190,110,0.9)'); g.addColorStop(1, 'rgba(226,190,110,0)');
    c.strokeStyle = g; c.lineWidth = diamond ? 2 : 1.5; c.beginPath(); c.moveTo(x0, y); c.lineTo(x1, y); c.stroke();
    if (diamond) { c.save(); c.translate(x0, y); c.rotate(Math.PI / 4); c.fillStyle = '#e8c56e'; c.fillRect(-4.5, -4.5, 9, 9); c.restore(); }
  });
}

function card(c, x, y, w, h, r) {
  c.save(); c.shadowColor = 'rgba(0,0,0,0.45)'; c.shadowBlur = 50; c.shadowOffsetY = 20;
  rr(c, x, y, w, h, r);
  const g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(30,44,86,0.92)'); g.addColorStop(1, 'rgba(12,20,44,0.92)');
  c.fillStyle = g; c.fill(); c.restore();
  rr(c, x, y, w, h, r); c.strokeStyle = 'rgba(226,190,110,0.28)'; c.lineWidth = 1.5; c.stroke();
  rr(c, x + w / 2 - 34, y - 2, 68, 5, 2.5); c.fillStyle = goldGrad(c, x + w / 2 - 34, 0, x + w / 2 + 34, 0); c.fill();
}

function drawHeading(c, mode) {
  const cx = W / 2;
  c.direction = 'rtl'; c.textAlign = 'center'; c.textBaseline = 'alphabetic';
  if (T.kicker.trim()) {
    fitFont(c, T.kicker, 500, 26, FB, 700);
    c.fillStyle = 'rgba(255,255,255,0.8)'; c.fillText(T.kicker, cx, 236);
  }
  const ty = 318;
  fitFont(c, T.title, 900, 80, FH, 620);
  const tw = c.measureText(T.title).width;
  c.save(); c.shadowColor = 'rgba(214,171,78,0.45)'; c.shadowBlur = 30;
  const tg = c.createLinearGradient(0, ty - 76, 0, ty + 10);
  tg.addColorStop(0, '#fff1c4'); tg.addColorStop(.55, '#e2b85a'); tg.addColorStop(1, '#b8862f');
  c.fillStyle = tg; c.fillText(T.title, cx, ty); c.restore();
  sideLines(c, cx, ty - 28, tw / 2, 30, 150, true);

  const num = val('num', mode);
  if (num || mode === 'preview') {
    const txt = 'الاجتماع رقم ' + (num || '__');
    c.font = `600 22px ${FB}`; c.textBaseline = 'middle';
    const bw = c.measureText(txt).width + 52, bh = 42, bx = cx - bw / 2, by = 377 - bh / 2;
    rr(c, bx, by, bw, bh, bh / 2);
    c.fillStyle = goldGrad(c, bx, by, bx + bw, by + bh); c.globalAlpha = num ? 1 : .45; c.fill(); c.globalAlpha = 1;
    c.fillStyle = '#0b1430'; c.fillText(txt, cx, by + bh / 2 + 1);
    c.textBaseline = 'alphabetic';
  }
}

function drawTheme(c, mode) {
  const { x, y, w, h, r } = THEME, cx = x + w / 2;
  card(c, x, y, w, h, r);
  c.direction = 'rtl'; c.textAlign = 'center';
  c.font = `600 22px ${FB}`; c.fillStyle = '#e8c56e';
  const label = 'موضوع اللقاء';
  c.fillText(label, cx, y + 50);
  sideLines(c, cx, y + 43, c.measureText(label).width / 2, 16, 70, false);
  const theme = val('theme', mode);
  if (theme) {
    fitFont(c, theme, 800, 48, FH, w - 80);
    c.fillStyle = '#ffffff'; c.fillText(theme, cx, y + 118);
  } else if (mode === 'preview') {
    c.font = `500 30px ${FB}`; c.fillStyle = 'rgba(255,255,255,0.28)'; c.fillText('اكتب موضوع اللقاء', cx, y + 114);
  }
}

function drawTiles(c, mode) {
  TILES.forEach(t => {
    const cx = t.x + TILE.w / 2, y = TILE.y;
    card(c, t.x, y, TILE.w, TILE.h, TILE.r);
    // icon
    const iy = y + 66;
    const gl = c.createRadialGradient(cx, iy, 20, cx, iy, 80);
    gl.addColorStop(0, 'rgba(214,170,80,0.22)'); gl.addColorStop(1, 'rgba(214,170,80,0)');
    c.fillStyle = gl; c.beginPath(); c.arc(cx, iy, 80, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.arc(cx, iy, 34, 0, Math.PI * 2); c.fillStyle = goldGrad(c, cx - 34, iy - 34, cx + 34, iy + 34); c.fill();
    c.beginPath(); c.arc(cx, iy, 42, 0, Math.PI * 2); c.strokeStyle = 'rgba(226,190,110,0.35)'; c.lineWidth = 1.5; c.stroke();
    drawIcon(c, t.icon, cx, iy);
    // texts
    c.direction = 'rtl'; c.textAlign = 'center';
    c.font = `600 21px ${FB}`; c.fillStyle = '#e8c56e'; c.fillText(t.label, cx, y + 140);
    const v1 = val(t.v1, mode), v2 = val(t.v2, mode);
    if (v1) {
      fitFont(c, v1, 800, 30, FH, TILE.w - 32);
      c.fillStyle = '#ffffff'; c.fillText(v1, cx, y + 188);
    } else if (mode === 'preview') {
      c.font = `500 24px ${FB}`; c.fillStyle = 'rgba(255,255,255,0.28)'; c.fillText(t.ph1, cx, y + 186);
    }
    if (v2) {
      fitFont(c, v2, 400, 21, FB, TILE.w - 32);
      c.fillStyle = 'rgba(214,222,240,0.68)'; c.fillText(v2, cx, y + 224);
    } else if (mode === 'preview' && t.ph2) {
      c.font = `400 20px ${FB}`; c.fillStyle = 'rgba(255,255,255,0.22)'; c.fillText(t.ph2, cx, y + 224);
    }
  });
}

function drawFooter(c) {
  const cx = W / 2;
  c.direction = 'rtl'; c.textAlign = 'center';
  if (T.note.trim()) {
    fitFont(c, T.note, 600, 23, FB, 760);
    c.textBaseline = 'middle';
    const bw = c.measureText(T.note).width + 60, bh = 48, bx = cx - bw / 2, by = 922 - bh / 2;
    rr(c, bx, by, bw, bh, bh / 2); c.fillStyle = 'rgba(217,178,90,0.12)'; c.fill();
    c.strokeStyle = 'rgba(226,190,110,0.6)'; c.lineWidth = 1.5; c.stroke();
    c.fillStyle = '#f1d68b'; c.fillText(T.note, cx, by + bh / 2 + 1);
    c.textBaseline = 'alphabetic';
  }
  if (T.slogan.trim()) {
    const sy = 1036;
    fitFont(c, T.slogan, 700, 25, FH, 640);
    const sw = c.measureText(T.slogan).width;
    c.fillStyle = goldGrad(c, cx - sw / 2, 0, cx + sw / 2, 0); c.fillText(T.slogan, cx, sy);
    sideLines(c, cx, sy - 9, sw / 2, 18, 60, false);
  }
}

function render(c, mode) {
  c.clearRect(0, 0, W, H);
  drawBackground(c);
  drawLogo(c);
  drawHeading(c, mode);
  drawTheme(c, mode);
  drawTiles(c, mode);
  drawFooter(c);
}
function draw() { render(ctx, 'preview'); }

/* ---------- export ---------- */
function makeBlob(mode) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  render(c.getContext('2d'), mode);
  return new Promise(res => c.toBlob(res, 'image/png'));
}
const canShareFiles = (() => { try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })); } catch { return false; } })();
async function exportPNG(mode, name) {
  const b = await makeBlob(mode);
  if (canShareFiles) {   // phones: opens the share sheet (Save Image / WhatsApp / ...)
    try { await navigator.share({ files: [new File([b], name, { type: 'image/png' })] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
if (canShareFiles) $('dl').textContent = 'حفظ / مشاركة الصورة';
$('dl').onclick = () => {
  const tag = (T.num.trim() || T.date.trim() || 'next').replace(/[\\/:*?"<>|\s]+/g, '-');
  exportPNG('final', `albayan-next-meeting-${tag}.png`);
};
$('dlBlank').onclick = () => exportPNG('blank', 'albayan-next-meeting-template.png');

/* ---------- boot ---------- */
(async () => {
  const fonts = [`900 80px Cairo`, `800 48px Cairo`, `800 30px Cairo`, `700 25px Cairo`, `500 26px "IBM Plex Sans Arabic"`, `600 22px "IBM Plex Sans Arabic"`, `400 21px "IBM Plex Sans Arabic"`];
  try { await Promise.race([Promise.all(fonts.map(f => document.fonts.load(f, 'الاجتماع القادم'))), new Promise(r => setTimeout(r, 4000))]); } catch {}
  [logo, tiLogo] = await Promise.all([loadClubLogo(), loadImg(TI_SRC)]);
  draw();
  const q = new URLSearchParams(location.search).get('render');
  if (q) {
    if (q === 'sample') Object.assign(T, { num: '25', theme: 'فن الإقناع', date: '25 نوفمبر 2026', day: 'الأربعاء', time: '8:00 مساءً', timeNote: 'لمدة ساعتين', venue: 'مكتبة الملك فهد', city: 'الرياض' });
    const c = document.createElement('canvas'); c.width = W; c.height = H; render(c.getContext('2d'), q === 'sample' ? 'final' : q === 'preview' ? 'preview' : 'blank');
    const out = document.createElement('pre'); out.id = 'out'; out.textContent = c.toDataURL('image/png'); document.body.appendChild(out);
  }
})();
